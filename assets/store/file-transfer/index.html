<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FTP & Network Drives</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } }
    .conn { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .conn:hover { background: var(--wd-surface-2); } .conn.on { background: rgba(13,148,136,.18); }
    .crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; font-size: 13px; }
    .crumbs button { background: none; border: 0; color: var(--wd-accent); cursor: pointer; padding: 2px 4px; font: inherit; }
    .files td { padding: 7px 10px; }
    .files tr.dir td:first-child { cursor: pointer; }
    .files tr:hover { background: var(--wd-surface-2); }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1300px">
    <div class="wd-header">
      <div class="wd-icon">🔁</div>
      <div><h1>FTP & Network Drives</h1><div class="wd-sub">FTP · SFTP · WebDAV · SMB · S3</div></div>
      <div class="wd-spacer"></div><button class="wd-btn" id="folder">Open downloads</button>
    </div>
    <div class="wd-card" id="setup" hidden></div>
    <div class="shell">
      <aside class="wd-card">
        <div class="wd-row" style="margin-bottom:8px"><b class="wd-grow">Connections</b><button class="wd-btn wd-btn-sm wd-btn-primary" id="new">+ New</button></div>
        <div id="conns"></div>
      </aside>
      <main class="wd-stack">
        <div class="wd-card" id="browser"><div class="wd-empty"><div class="wd-empty-icon">🗂️</div>Add a connection to browse a server.</div></div>
        <div class="wd-card" id="transfers" hidden><h3 style="margin-bottom:8px">Transfers</h3><div class="wd-list" id="tlist"></div></div>
      </main>
    </div>
  </div>
  <dialog class="wd-dialog" id="dlg" style="width:min(560px, calc(100vw - 32px))"></dialog>
  <script src="app.js"></script>
</body>
</html>
