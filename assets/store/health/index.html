<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Health Tracker</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    .tile h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .big { font-size: 30px; font-weight: 800; }
    .glasses { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
    .glass { width: 22px; height: 28px; border: 2px solid #38bdf8; border-radius: 0 0 6px 6px; position: relative; overflow: hidden; }
    .glass.full::after { content: ''; position: absolute; inset: 30% 0 0; background: #38bdf8; }
    .moods { display: flex; gap: 6px; } .moods button { font-size: 26px; background: var(--wd-surface-2); border: 2px solid transparent; border-radius: 10px; padding: 4px 6px; cursor: pointer; }
    .moods button[aria-pressed="true"] { border-color: var(--wd-accent); }
    .stars button { background: none; border: 0; font-size: 20px; cursor: pointer; color: #6e7681; } .stars button.on { color: #f59e0b; }
    .dnav { display: flex; align-items: center; gap: 8px; }
    .chart text { fill: var(--wd-muted); font-size: 10px; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1100px">
    <div class="wd-header">
      <div class="wd-icon">❤️</div>
      <div><h1>Health Tracker</h1><div class="wd-sub">Water · sleep · weight · steps · mood</div></div>
      <div class="wd-spacer"></div>
      <div class="dnav"><button class="wd-btn wd-btn-sm" id="prevDay">‹</button><input type="date" class="wd-input" id="day" style="width:auto"><button class="wd-btn wd-btn-sm" id="nextDay">›</button></div>
      <div class="wd-tabs"><button class="wd-tab" data-tab="today" aria-selected="true">Day</button><button class="wd-tab" data-tab="trends" aria-selected="false">Trends</button><button class="wd-tab" data-tab="settings" aria-selected="false">Settings</button></div>
    </div>
    <section id="today" class="cards"></section>
    <section id="trends" hidden></section>
    <section id="settings" hidden></section>
  </div>
  <script src="app.js"></script>
</body>
</html>
