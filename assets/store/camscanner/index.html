<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamScanner & PDF Maker</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .page-card { background: var(--wd-surface); border: 2px solid var(--wd-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .page-thumb-wrap { width: 100%; aspect-ratio: 1/1.414; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .page-thumb-wrap canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    .page-footer { padding: 8px 10px; display: flex; align-items: center; gap: 6px; background: var(--wd-surface-2); }
    .filter-btn-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1100px">
    <div class="wd-header">
      <div class="wd-icon" style="background:#0284C7;color:#fff">📄</div>
      <div>
        <h1>CamScanner & PDF Maker</h1>
        <div class="wd-sub">Scan Documents · Magic Color Filters · Rearrange Pages · Export PDF</div>
      </div>
      <div class="wd-spacer"></div>
      <button class="wd-btn wd-btn-primary" id="btnAddPage">+ Add / Scan Page</button>
      <button class="wd-btn" id="btnExportPdf" style="background:#059669;color:#fff">📑 Export Multi-Page PDF</button>
      <button class="wd-btn wd-btn-ghost" id="btnClearAll">Clear All</button>
    </div>

    <!-- Global Batch Filter Bar -->
    <div class="wd-row" style="background:var(--wd-surface);padding:12px 16px;border-radius:12px;border:1px solid var(--wd-border);gap:12px;flex-wrap:wrap">
      <span style="font-weight:700">Apply Filter to All Pages:</span>
      <button class="wd-btn wd-btn-sm" data-global-filter="original">Original</button>
      <button class="wd-btn wd-btn-sm wd-btn-primary" data-global-filter="magic">✨ Magic Color</button>
      <button class="wd-btn wd-btn-sm" data-global-filter="bw">⬛ B&W Clean</button>
      <button class="wd-btn wd-btn-sm" data-global-filter="gray">🔘 Grayscale</button>
      <button class="wd-btn wd-btn-sm" data-global-filter="contrast">⚡ High Contrast</button>
      <div class="wd-spacer"></div>
      <span class="wd-small wd-muted" id="pageCountLabel">0 pages</span>
    </div>

    <!-- Scanned Pages Grid (Rearrangeable) -->
    <div class="pages-grid" id="pagesGrid">
      <div class="wd-empty" style="grid-column:1/-1">
        <div class="wd-empty-icon">📄</div>
        No pages added yet. Click "+ Add / Scan Page" or drag & drop documents/photos here.
      </div>
    </div>
  </div>

  <input type="file" id="scanInput" accept="image/*" multiple style="display:none">

  <script src="/__webdeck/vendor/pdf-lib.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
