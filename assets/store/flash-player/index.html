<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flash Player</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    #stage { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; display: grid; place-items: center; color: #777; }
    #stage ruffle-player, #stage ruffle-object { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1200px">
    <div class="wd-header">
      <div class="wd-icon">⚡</div>
      <div><h1>Flash Player</h1><div class="wd-sub">Play .swf games &amp; animations with Ruffle</div></div>
      <div class="wd-spacer"></div>
      <button class="wd-btn wd-btn-primary" id="open">Open SWF files</button>
    </div>
    <form class="wd-card wd-row" id="urlForm" style="margin-bottom:14px"><input class="wd-input wd-grow" id="url" placeholder="Or paste a link to a .swf file"><button class="wd-btn">Download &amp; play</button></form>
    <div class="layout">
      <div><div id="stage"><span id="msg">Open a .swf file to play</span></div>
        <div class="wd-row" style="margin-top:8px"><b id="now" class="wd-grow"></b><button class="wd-btn wd-btn-sm" id="full">Fullscreen</button></div></div>
      <div class="wd-card"><h3 style="margin-bottom:8px">Library</h3><div class="wd-list" id="lib"></div></div>
    </div>
    <p class="wd-small wd-muted" style="margin-top:16px">Ruffle runs Flash content in a sandbox, so it's safe even for old files. Some ActionScript 3 games may not work yet.</p>
  </div>
  <script>window.RufflePlayer = window.RufflePlayer || {}; window.RufflePlayer.config = { publicPath: '/ruffle/', polyfills: false, autoplay: 'on', unmuteOverlay: 'hidden', letterbox: 'on', contextMenu: 'on', warnOnUnsupportedContent: false, showSwfDownload: false };</script>
  <script src="ruffle/ruffle.js"></script>
  <script src="app.js"></script>
</body>
</html>
