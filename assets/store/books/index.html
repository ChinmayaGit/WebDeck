<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .results { display: flex; flex-direction: column; gap: 8px; }
    .book { display: flex; gap: 12px; align-items: center; background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 10px; padding: 10px; }
    .cover { width: 54px; height: 80px; border-radius: 4px; object-fit: cover; background: var(--wd-surface-2); flex: none; display: grid; place-items: center; font-size: 22px; }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
    .shelf .item { cursor: pointer; }
    .shelf .item .cover { width: 100%; height: auto; aspect-ratio: 2/3; font-size: 40px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
    .shelf .item .t { font-size: 13px; font-weight: 600; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bar { height: 3px; background: var(--wd-surface-2); border-radius: 2px; margin-top: 4px; }
    .bar div { height: 100%; background: var(--wd-accent); border-radius: 2px; }
    .src { font-size: 11px; }
    #reader { position: fixed; inset: 0; background: var(--rd-bg, #faf7f0); color: var(--rd-fg, #222); z-index: 50; display: flex; flex-direction: column; }
    #reader[hidden] { display: none; }
    #reader .top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,.06); }
    #reader .top button { background: transparent; border: 1px solid rgba(0,0,0,.15); color: inherit; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
    #reader .stage { flex: 1; overflow: auto; position: relative; }
    #viewer { width: 100%; height: 100%; }
    #pdfStage { display: flex; justify-content: center; padding: 16px; }
    #pdfStage canvas { box-shadow: 0 4px 20px rgba(0,0,0,.25); max-width: 100%; height: auto; }
    #textStage { max-width: 720px; margin: 0 auto; padding: 32px 24px; font: 18px/1.7 Georgia, serif; white-space: pre-wrap; }
    .nav-zone { position: absolute; top: 0; bottom: 0; width: 12%; z-index: 2; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1100px">
    <div class="wd-header">
      <div class="wd-icon">📚</div>
      <div><h1>Books</h1><div class="wd-sub">Gutenberg · Standard Ebooks · Open Library · Internet Archive</div></div>
      <div class="wd-spacer"></div>
      <div class="wd-tabs"><button class="wd-tab" data-tab="discover" aria-selected="true">Discover</button><button class="wd-tab" data-tab="library" aria-selected="false">My library</button></div>
    </div>
    <section id="discover">
      <form id="sForm" class="wd-row" style="margin-bottom:10px"><input class="wd-input wd-grow" id="q" placeholder="Search title or author, e.g. Pride and Prejudice, Tolstoy, Sherlock…"><button class="wd-btn wd-btn-primary">Search all libraries</button></form>
      <div class="wd-row wd-small" id="srcs" style="margin-bottom:12px"></div>
      <div class="results" id="results"><div class="wd-empty"><div class="wd-empty-icon">🔎</div>Search millions of free, public-domain books.</div></div>
    </section>
    <section id="library" hidden>
      <div class="wd-row" style="margin-bottom:14px"><span class="wd-muted wd-small wd-grow" id="libSub"></span><button class="wd-btn" id="addLocal">Add e-books from this computer</button></div>
      <div class="shelf" id="shelf"></div>
    </section>
  </div>

  <div id="reader" hidden>
    <div class="top">
      <button id="rClose">← Library</button>
      <b id="rTitle" class="wd-ellipsis" style="flex:1"></b>
      <span id="rPos" class="wd-small"></span>
      <button id="rSmaller" title="Smaller text">A−</button><button id="rBigger" title="Bigger text">A+</button>
      <button id="rTheme" title="Theme">◐</button>
      <button id="rPrev">‹</button><button id="rNext">›</button>
    </div>
    <div class="stage" id="stage">
      <div id="viewer"></div>
      <div id="pdfStage" hidden></div>
      <div id="textStage" hidden></div>
    </div>
  </div>

  <script src="/__webdeck/vendor/jszip.min.js"></script>
  <script src="/__webdeck/vendor/epub.min.js"></script>
  <script src="/__webdeck/vendor/pdf.min.js"></script>
  <script src="sources.js"></script>
  <script src="app.js"></script>
</body>
</html>
