<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    :root { --m-primary: #E11D48; --m-on-primary: #fff; --m-container: rgba(225,29,72,.16); --m-radius: 16px; }
    body { padding-bottom: 104px; }
    svg.i { width: 22px; height: 22px; fill: currentColor; display: block; }
    .m-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .m-title { font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
    .m-tabs { display: inline-flex; background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 999px; padding: 4px; gap: 2px; }
    .m-tabs .wd-tab { border: 0; border-radius: 999px; padding: 8px 16px; background: none; color: var(--wd-muted); font-weight: 600; cursor: pointer; }
    .m-tabs .wd-tab[aria-selected="true"] { background: var(--m-container); color: var(--m-primary); }
    .m-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .m-search { flex: 1; min-width: 180px; max-width: 360px; border-radius: 999px !important; padding-left: 16px !important; }
    .m-btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 9px 16px; border: 1px solid var(--wd-border); background: var(--wd-surface); color: var(--wd-text); font-weight: 600; cursor: pointer; }
    .m-btn svg.i { width: 18px; height: 18px; }
    .m-btn.filled { background: var(--m-primary); color: var(--m-on-primary); border-color: transparent; box-shadow: 0 2px 8px rgba(225,29,72,.35); }
    .track { display: grid; grid-template-columns: 48px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 14px; cursor: pointer; transition: background .15s; }
    .track:hover { background: var(--wd-surface-2); }
    .track.playing { background: var(--m-container); }
    .track.playing .wd-ellipsis:first-child { color: var(--m-primary); font-weight: 700; }
    .track .n { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
    .icon-btn { background: none; border: 0; color: var(--wd-muted); cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--wd-surface-2); color: var(--wd-text); }
    .heart.on { color: var(--m-primary); }
    .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .album { cursor: pointer; border-radius: var(--m-radius); padding: 8px; transition: background .15s; }
    .album:hover { background: var(--wd-surface-2); }
    .album img, .album .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--wd-surface-2); display: grid; place-items: center; font-size: 40px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    .album .t { font-size: 13px; font-weight: 600; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Mini player that expands into a full Now Playing screen */
    .player { position: fixed; left: 12px; right: 12px; bottom: 12px; background: var(--wd-surface); border: 1px solid var(--wd-border);
      border-radius: 20px; padding: 10px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px;
      align-items: center; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: all .25s ease; }
    .np-info { display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
    .np-art { width: 52px; height: 52px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, #E11D48, #7C3AED); box-shadow: 0 4px 12px rgba(0,0,0,.3); transition: all .25s ease; }
    .np-art svg.i { width: 26px; height: 26px; opacity: .9; }
    .player .ctl { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .player .ctl button { background: none; border: 0; color: var(--wd-text); cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
    .player .ctl button:hover { background: var(--wd-surface-2); }
    .player .ctl .play { background: var(--m-primary); color: var(--m-on-primary); width: 52px; height: 52px; border-radius: 16px; box-shadow: 0 3px 10px rgba(225,29,72,.4); }
    .player .ctl .play:hover { background: var(--m-primary); filter: brightness(1.08); }
    .player .ctl .play svg.i { width: 28px; height: 28px; }
    .player .ctl .on { color: var(--m-primary); }
    .seek { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--wd-muted); font-variant-numeric: tabular-nums; }
    .seek input, .vol input { flex: 1; accent-color: var(--m-primary); }
    .vol { display: flex; align-items: center; gap: 6px; justify-content: flex-end; color: var(--wd-muted); }
    .np-close { display: none; }
    .player.expanded { inset: 0; border-radius: 0; border: 0; grid-template-columns: 1fr; align-content: center; justify-items: center;
      gap: 22px; padding: 24px; background: radial-gradient(circle at 50% 20%, var(--m-container), var(--wd-bg) 70%); }
    .player.expanded .np-info { flex-direction: column; text-align: center; max-width: 520px; width: 100%; }
    .player.expanded .np-art { width: min(72vw, 340px); height: min(72vw, 340px); border-radius: 28px; }
    .player.expanded .np-art svg.i { width: 96px; height: 96px; }
    .player.expanded #npTitle { font-size: 22px; white-space: normal; }
    .player.expanded .ctl-wrap { width: min(92vw, 520px); }
    .player.expanded .side.vol { display: flex; width: min(92vw, 520px); }
    .player.expanded .np-close { display: grid; position: absolute; top: 16px; left: 16px; }
    @media (max-width: 700px) {
      .player { grid-template-columns: minmax(0, 1fr) auto; }
      .player:not(.expanded) .seek, .player:not(.expanded) .side.vol, .player:not(.expanded) #shuffle, .player:not(.expanded) #repeat, .player:not(.expanded) #prev { display: none; }
    }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1100px">
    <div class="m-top">
      <div class="m-title">Music</div>
      <div class="wd-small wd-muted" id="sub" style="flex:1">Your music and free music from the Internet Archive</div>
      <div class="m-tabs wd-tabs">
        <button class="wd-tab" data-tab="library" aria-selected="true">My music</button>
        <button class="wd-tab" data-tab="favs" aria-selected="false">Favorites</button>
        <button class="wd-tab" data-tab="free" aria-selected="false">Discover</button>
      </div>
    </div>
    <section id="library">
      <div class="m-actions">
        <input class="wd-input m-search" id="filter" placeholder="Search your songs">
        <div class="wd-spacer"></div>
        <button class="m-btn" id="addFolder"><svg class="i" viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2zm4 12v-3h-3v-2h3V8h2v3h3v2h-3v3h-2z"/></svg>Folder</button>
        <button class="m-btn" id="addFiles"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>Files</button>
        <button class="m-btn filled" id="playAll"><svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play all</button>
      </div>
      <div id="tracks"></div>
    </section>
    <section id="favs" hidden><div id="favTracks"></div></section>
    <section id="free" hidden>
      <form id="fForm" class="m-actions">
        <input class="wd-input m-search" id="fq" placeholder="Search artists, genres or albums, e.g. jazz, lo-fi…" style="max-width:none">
        <select class="wd-select" id="fcol" style="width:auto;border-radius:999px"><option value="all">All open audio</option><option value="netlabels">Netlabels</option><option value="etree">Live concerts</option><option value="opensource_audio">Community audio</option><option value="audio_music">Music & arts</option></select>
        <button class="m-btn filled">Search</button>
      </form>
      <div id="freeOut"><div class="wd-empty"><div class="wd-empty-icon">🎶</div>Millions of free, legal recordings to stream or download.</div></div>
    </section>
  </div>

  <div class="player" id="player">
    <button class="icon-btn np-close" id="npClose" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    <div class="np-info" id="npInfo" title="Now playing">
      <div class="np-art" id="npArt"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
      <div style="min-width:0"><div class="wd-ellipsis" id="npTitle" style="font-weight:700">Nothing playing</div><div class="wd-ellipsis wd-small wd-muted" id="npSub"></div></div>
    </div>
    <div class="ctl-wrap">
      <div class="ctl">
        <button id="shuffle" title="Shuffle"></button><button id="prev" title="Previous"></button>
        <button class="play" id="play" title="Play"></button>
        <button id="next" title="Next"></button><button id="repeat" title="Repeat"></button>
      </div>
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    </div>
    <div class="side vol"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="vol" min="0" max="100" value="80" style="max-width:130px"></div>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
