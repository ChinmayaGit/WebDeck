<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vedas & Sacred Wisdom</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    :root {
      --v-font-size: 24px;
      --v-line-height: 1.8;
      --v-bg: var(--wd-background);
      --v-surface: var(--wd-surface);
      --v-text: var(--wd-text);
      --v-accent: #f59e0b;
    }
    body.theme-warm {
      --v-bg: #FAF5EB;
      --v-surface: #F3EBD9;
      --v-text: #2C2416;
      --v-accent: #B45309;
      background: var(--v-bg);
      color: var(--v-text);
    }
    body.theme-light {
      --v-bg: #FFFFFF;
      --v-surface: #F4F4F5;
      --v-text: #18181B;
      --v-accent: #D97706;
      background: var(--v-bg);
      color: var(--v-text);
    }
    .elder-controls { display: flex; align-items: center; gap: 10px; background: var(--v-surface); padding: 12px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; flex-wrap: wrap; }
    .elder-btn { font-size: 16px; font-weight: 700; padding: 10px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--v-accent); background: transparent; color: inherit; }
    .elder-btn.active { background: var(--v-accent); color: #fff; }
    .audio-player-bar { background: var(--v-surface); border: 2px solid var(--v-accent); border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
    .play-circle { width: 56px; height: 56px; border-radius: 50%; background: var(--v-accent); color: #fff; border: none; font-size: 24px; cursor: pointer; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(217,119,6,.4); }
    .verse-card { background: var(--v-surface); border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(120,120,120,.2); }
    .sanskrit { font-size: calc(var(--v-font-size) * 1.25); font-weight: 700; line-height: 1.6; color: var(--v-accent); margin-bottom: 14px; font-family: 'Noto Sans Devanagari', 'Siddhanta', serif; }
    .translit { font-size: var(--v-font-size); font-style: italic; line-height: var(--v-line-height); margin-bottom: 14px; opacity: .9; }
    .meaning { font-size: calc(var(--v-font-size) * 0.9); line-height: 1.6; padding-top: 12px; border-top: 1px dashed rgba(120,120,120,.25); }
    .v-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:960px">
    <!-- Header -->
    <div class="wd-header" style="margin-bottom:12px">
      <div class="wd-icon" style="background:#D97706;color:#fff;font-size:26px">🕉️</div>
      <div>
        <h1 style="font-size:24px">Vedas & Sacred Chants</h1>
        <div class="wd-sub" style="font-size:14px">Elderly-Friendly Reader & Peaceful Chanting Audio Player</div>
      </div>
      <div class="wd-spacer"></div>
    </div>

    <!-- Elderly Friendly Accessibility Controls -->
    <div class="elder-controls">
      <span style="font-weight:700;font-size:15px">Text Size:</span>
      <button class="elder-btn" id="btnFontNormal">Standard</button>
      <button class="elder-btn active" id="btnFontLarge">Large (A+)</button>
      <button class="elder-btn" id="btnFontHuge">Extra Large (A++)</button>
      <div class="wd-spacer"></div>
      <span style="font-weight:700;font-size:15px">Theme:</span>
      <button class="elder-btn" id="btnThemeDark">🌙 Dark</button>
      <button class="elder-btn" id="btnThemeWarm">📜 Warm Paper</button>
      <button class="elder-btn" id="btnThemeLight">☀️ Day Light</button>
    </div>

    <!-- Audio Player Bar -->
    <div class="audio-player-bar">
      <button class="play-circle" id="btnAudioPlay" aria-label="Play/Pause Chanting">▶</button>
      <div style="flex:1">
        <div style="font-size:17px;font-weight:700" id="currentAudioTitle">Gayatri Mantra (Rigveda 3.62.10)</div>
        <div style="font-size:13px;opacity:.8" id="currentAudioSub">Peaceful Vedic Chanting & Meditation Audio</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <label style="font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="chkLoopAudio" checked style="width:18px;height:18px"> Repeat Chants
        </label>
        <button class="elder-btn" id="btnNextAudio">Next Chant ⏭</button>
      </div>
    </div>

    <!-- Vedas Navigation Tabs -->
    <div class="v-tabs">
      <button class="elder-btn active" data-book="gayatri">🕉️ Daily Suktas</button>
      <button class="elder-btn" data-book="rigveda">Rigveda</button>
      <button class="elder-btn" data-book="samaveda">Samaveda</button>
      <button class="elder-btn" data-book="yajurveda">Yajurveda</button>
      <button class="elder-btn" data-book="atharvaveda">Atharvaveda</button>
      <button class="elder-btn" data-book="upanishads">Upanishads & Gita</button>
    </div>

    <!-- Verses Container -->
    <div id="versesContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
