<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Radio & Lofi</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .radio-player { background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
    .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .station-card { background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 12px; padding: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: transform .15s ease, border-color .15s ease; }
    .station-card:hover { transform: translateY(-2px); border-color: var(--wd-primary); }
    .station-card.active { border-color: var(--wd-accent); background: var(--wd-surface-2); }
    .station-icon { width: 44px; height: 44px; border-radius: 10px; background: #14B8A6; color: #fff; font-size: 20px; display: grid; place-items: center; flex: none; }
    .visualizer-canvas { width: 100%; height: 60px; background: var(--wd-surface-2); border-radius: 8px; }
    .play-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--wd-primary); color: #fff; border: none; font-size: 20px; cursor: pointer; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1100px">
    <div class="wd-header">
      <div class="wd-icon" style="background:#14B8A6;color:#fff">📻</div>
      <div>
        <h1>Global Radio & Lofi</h1>
        <div class="wd-sub">Live World Stations · Lofi Chillhop · Ambient · Classical · Audio Visualizer</div>
      </div>
      <div class="wd-spacer"></div>
      <select id="sleepTimerSelect" class="wd-input" style="max-width:160px;font-size:12px">
        <option value="0">⏱ Sleep Timer: Off</option>
        <option value="15">15 Minutes</option>
        <option value="30">30 Minutes</option>
        <option value="60">1 Hour</option>
      </select>
    </div>

    <!-- Active Stream Player Bar -->
    <div class="radio-player">
      <div class="wd-row" style="gap:16px">
        <button class="play-btn" id="btnTogglePlay">▶</button>
        <div style="flex:1">
          <div style="font-weight:700;font-size:16px" id="playerTitle">Lofi Chillhop Radio</div>
          <div class="wd-small wd-muted" id="playerMeta">Relaxing beats for focus, coding and studying · 128 kbps AAC</div>
        </div>
        <div class="wd-row" style="gap:8px">
          <span>🔊</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8" style="width:90px">
        </div>
      </div>
      <canvas class="visualizer-canvas" id="visCanvas"></canvas>
    </div>

    <!-- Category Tabs -->
    <div class="wd-row" style="margin-bottom:14px;gap:8px;flex-wrap:wrap">
      <div class="wd-tabs">
        <button class="wd-tab" data-cat="lofi" aria-selected="true">☕ Lofi & Chill</button>
        <button class="wd-tab" data-cat="classical" aria-selected="false">🎻 Classical</button>
        <button class="wd-tab" data-cat="jazz" aria-selected="false">🎷 Smooth Jazz</button>
        <button class="wd-tab" data-cat="ambient" aria-selected="false">🌌 Ambient / Space</button>
        <button class="wd-tab" data-cat="news" aria-selected="false">🎙️ World News</button>
        <button class="wd-tab" data-cat="favs" aria-selected="false">★ Favorites</button>
      </div>
      <div class="wd-spacer"></div>
      <input type="text" id="searchInput" class="wd-input" style="max-width:240px" placeholder="Search station or country…">
    </div>

    <!-- Station Grid -->
    <div class="station-grid" id="stationGrid"></div>
  </div>

  <audio id="audioEl" crossorigin="anonymous"></audio>

  <script src="app.js"></script>
</body>
</html>
