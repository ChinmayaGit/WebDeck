<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Converter & Inspector</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .font-stage { background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .preview-box { background: var(--wd-surface-2); border: 1px solid var(--wd-border); border-radius: 8px; padding: 18px; outline: none; min-height: 140px; font-size: 28px; line-height: 1.4; }
    .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; max-height: 200px; overflow-y: auto; padding: 8px; background: var(--wd-surface-2); border-radius: 8px; }
    .glyph-cell { height: 44px; display: grid; place-items: center; border: 1px solid var(--wd-border); border-radius: 6px; font-size: 20px; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1040px">
    <div class="wd-header">
      <div class="wd-icon" style="background:#64748B;color:#fff">🔤</div>
      <div>
        <h1>Font Converter & Inspector</h1>
        <div class="wd-sub">Convert TTF / OTF ⇄ WOFF / WOFF2 · Preview Typography · Inspect Glyphs</div>
      </div>
      <div class="wd-spacer"></div>
      <button class="wd-btn wd-btn-primary" id="btnUploadFont">+ Open Font File (.ttf/.otf)</button>
      <button class="wd-btn" id="btnDownloadWoff2">⬇ Convert & Export .woff2</button>
      <button class="wd-btn" id="btnCopyCss">📋 Copy @font-face CSS</button>
    </div>

    <!-- Live Preview Stage -->
    <div class="font-stage">
      <div class="wd-row" style="gap:14px;flex-wrap:wrap">
        <span style="font-weight:700" id="fontNameLabel">Current Font: System Sans-Serif</span>
        <div class="wd-spacer"></div>
        <label class="wd-row" style="gap:6px">
          <span class="wd-small">Size:</span>
          <input type="range" id="fontSizeSlider" min="14" max="72" value="28">
          <span id="fontSizeDisplay" class="wd-small">28px</span>
        </label>
      </div>

      <!-- Editable Preview Text -->
      <div class="preview-box" id="previewText" contenteditable="true">
        The quick brown fox jumps over the lazy dog. 1234567890 !@#$%^&*()
      </div>

      <!-- Glyphs Inspector -->
      <div style="font-weight:700;font-size:13px;margin-top:8px">Glyphs & Character Set</div>
      <div class="glyph-grid" id="glyphGrid"></div>
    </div>
  </div>

  <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display:none">

  <script src="app.js"></script>
</body>
</html>
