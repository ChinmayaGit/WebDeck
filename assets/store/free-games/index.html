<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Games</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .game { background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .game img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--wd-surface-2); }
    .game .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .game .title { font-weight: 650; line-height: 1.3; }
    .worth { text-decoration: line-through; color: var(--wd-muted); font-size: 12px; }
    .free { color: var(--wd-green); font-weight: 800; letter-spacing: .5px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .game .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 8px; }
    .settings label { display: inline-flex; gap: 6px; align-items: center; margin: 4px 14px 4px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wd-app">
    <div class="wd-header">
      <div class="wd-icon">🎮</div>
      <div>
        <h1>Free Games</h1>
        <div class="wd-sub" id="sub">Free-to-keep giveaways across stores</div>
      </div>
      <div class="wd-spacer"></div>
      <button class="wd-btn" id="settingsBtn">Alerts</button>
      <button class="wd-btn" id="refresh">Refresh</button>
    </div>

    <div class="wd-card settings" id="settings" hidden style="margin-bottom:14px">
      <h3 style="margin-bottom:6px">Notify me about new free games on</h3>
      <div id="notifyPlatforms"></div>
      <label style="margin-top:8px"><input type="checkbox" id="includeLoot"> Also show in-game loot &amp; DLC giveaways</label>
    </div>

    <div class="chips" id="chips"></div>
    <div id="error"></div>
    <div class="games" id="games"></div>
    <p class="wd-small wd-muted" style="margin-top:24px">Giveaway data provided by <a href="#" id="credit">GamerPower.com</a>.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
