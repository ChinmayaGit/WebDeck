<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Scanner (OCR)</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .ocr-layout { display: flex; gap: 16px; height: calc(100vh - 120px); min-height: 500px; }
    .image-pane { flex: 1; background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .image-preview { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; overflow: hidden; background: #000; }
    .image-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .text-pane { flex: 1; background: var(--wd-surface); border: 1px solid var(--wd-border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .extracted-text { flex: 1; width: 100%; background: #0F172A; border: 1px solid var(--wd-border); border-radius: 8px; padding: 12px; color: #F8FAFC; font-family: monospace; font-size: 14px; line-height: 1.6; resize: none; outline: none; }
  </style>
</head>
<body>
  <div class="wd-app" style="max-width:1160px">
    <div class="wd-header">
      <div class="wd-icon" style="background:#0EA5E9;color:#fff">🔤</div>
      <div>
        <h1>Text Scanner (OCR)</h1>
        <div class="wd-sub">Extract Copyable Text from Photos, Screenshots & Documents Offline</div>
      </div>
      <div class="wd-spacer"></div>
      <button class="wd-btn wd-btn-primary" id="btnUploadImage">+ Open Photo / Scan</button>
      <button class="wd-btn" id="btnCopyText">📋 Copy Text</button>
      <button class="wd-btn" id="btnDownloadTxt">⬇ Export .txt</button>
    </div>

    <div class="ocr-layout">
      <!-- Input Image Area -->
      <div class="image-pane">
        <div class="wd-row" style="padding:10px 14px;background:var(--wd-surface-2);border-bottom:1px solid var(--wd-border)">
          <span style="font-weight:700;font-size:13px">Source Document Image</span>
          <div class="wd-spacer"></div>
          <button class="wd-btn wd-btn-sm" id="btnPasteClipboard">Paste from Clipboard</button>
        </div>
        <div class="image-preview" id="imagePreviewContainer">
          <div class="wd-empty" style="color:var(--wd-muted)">
            <div class="wd-empty-icon">📷</div>
            Drop or paste an image here to extract text.
          </div>
        </div>
      </div>

      <!-- Output Text Area -->
      <div class="text-pane">
        <div class="wd-row">
          <span style="font-weight:700;font-size:13px">Extracted Text Output</span>
          <div class="wd-spacer"></div>
          <span class="wd-small wd-muted" id="wordCount">0 words · 0 chars</span>
        </div>
        <textarea class="extracted-text" id="extractedOutput" placeholder="Recognized text will appear here…"></textarea>
      </div>
    </div>
  </div>

  <input type="file" id="ocrFileInput" accept="image/*" style="display:none">

  <script src="app.js"></script>
</body>
</html>
