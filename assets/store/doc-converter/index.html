<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doc Converter</title>
  <link rel="stylesheet" href="/__webdeck/ui.css">
  <style>
    .tool { display: flex; align-items: center; gap: 10px; }
    .tool + .tool { margin-top: 10px; }
    .file .ext { font: 700 11px var(--wd-mono); background: var(--wd-surface-2); border: 1px solid var(--wd-border); border-radius: 6px; padding: 6px 8px; min-width: 52px; text-align: center; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="wd-app">
    <div class="wd-header">
      <div class="wd-icon">📄</div>
      <div>
        <h1>Doc Converter</h1>
        <div class="wd-sub">Word · Markdown · HTML · ODT · RTF · EPUB · PDF</div>
      </div>
      <div class="wd-spacer"></div>
      <button class="wd-btn" id="openFolder">Open output folder</button>
    </div>

    <div class="wd-card" id="tools">
      <h2 style="margin-bottom:10px">Converters</h2>
      <div id="toolList" class="wd-muted">Checking…</div>
    </div>

    <div class="wd-card">
      <div class="wd-row">
        <button class="wd-btn wd-btn-primary" id="pick">Choose documents</button>
        <div class="wd-spacer"></div>
        <label class="wd-label" for="target" style="margin:0">Convert to</label>
        <select class="wd-select" id="target" style="width:auto">
          <option value="pdf">PDF</option>
          <option value="docx" selected>Word (.docx)</option>
          <option value="odt">OpenDocument (.odt)</option>
          <option value="rtf">Rich Text (.rtf)</option>
          <option value="html">HTML</option>
          <option value="md">Markdown</option>
          <option value="txt">Plain text</option>
          <option value="epub">EPUB e-book</option>
        </select>
        <button class="wd-btn wd-btn-primary" id="convert" disabled>Convert</button>
      </div>
      <p class="wd-small wd-muted" style="margin-top:10px" id="hint"></p>
    </div>

    <div class="wd-list" id="files" style="margin-top:14px"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
